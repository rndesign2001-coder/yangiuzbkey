name: Release

# Push a tag like v1.0.7 to build and publish a GitHub Release with the APK and AAB.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          YUK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YUK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YUK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            export YUK_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "YangiUzbKey-${GITHUB_REF_NAME#v}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "YangiUzbKey-${GITHUB_REF_NAME#v}.aab"
          else
            # No signing secrets: publish a debug build so the release still has an installable APK.
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "YangiUzbKey-${GITHUB_REF_NAME#v}-debug.apk"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" YangiUzbKey-*.a* --title "Yangi Uzb Key ${GITHUB_REF_NAME#v}" --generate-notes
